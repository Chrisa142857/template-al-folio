name: Update viberank og:image

# Refreshes the viberank_og_image value in _config.yml from the profile's
# live og:image meta tag, so the footer sharing card always shows current
# cost/rank instead of a stale hard-coded URL. Commits only when the URL
# actually changed. That commit does NOT re-trigger deploy.yml: a push made
# with the default GITHUB_TOKEN never starts a new workflow run, so the last
# step dispatches deploy.yml explicitly (workflow_dispatch is the documented
# exception). See docs.github.com/en/actions/concepts/security/github_token

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write # needed to dispatch deploy.yml (see "Trigger deploy workflow")

concurrency:
  group: viberank-og-image
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch profile HTML
        id: fetch
        run: |
          set +e
          curl -sSL --max-time 30 \
            -A "Mozilla/5.0 (compatible; viberank-og-updater/1.0; +https://ziquanw.com)" \
            -H "Accept: text/html" \
            "https://viberank.app/profile/Chrisa142857" -o profile.html
          code=$?
          if [ $code -ne 0 ] || [ ! -s profile.html ]; then
            echo "::warning::Could not fetch viberank profile (curl exit $code); skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Parse og:image and update _config.yml
        if: steps.fetch.outputs.ok == 'true'
        run: |
          python3 - <<'PY'
          import re, sys, html
          page = open('profile.html', encoding='utf-8', errors='ignore').read()
          pat = [
              r'<meta[^>]+property=["\']og:image["\'][^>]*?content=["\']([^"\']+)["\']',
              r'<meta[^>]+content=["\']([^"\']+)["\'][^>]*?property=["\']og:image["\']',
          ]
          url = None
          for p in pat:
              m = re.search(p, page, re.I)
              if m:
                  url = m.group(1).strip()
                  break
          if not url:
              print("::warning::og:image meta tag not found; leaving _config.yml unchanged.")
              sys.exit(0)
          url = html.unescape(url)  # store the true URL (raw &); the template escapes once
          if url.startswith('/'):
              url = 'https://viberank.app' + url
          cfg = open('_config.yml', encoding='utf-8').read()
          if not re.search(r'(?m)^viberank_og_image:', cfg):
              print("::warning::viberank_og_image key not found in _config.yml.")
              sys.exit(0)
          new = re.sub(r'(?m)^viberank_og_image:.*$',
                       lambda _m: 'viberank_og_image: ' + url, cfg)
          if new != cfg:
              open('_config.yml', 'w', encoding='utf-8').write(new)
              print("Updated viberank_og_image ->", url)
          else:
              print("viberank_og_image already current; no change.")
          PY

      - name: Commit if changed
        id: commit
        if: steps.fetch.outputs.ok == 'true'
        run: |
          rm -f profile.html
          if git diff --quiet -- _config.yml; then
            echo "No change to _config.yml."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _config.yml
          git commit -m "chore(viberank): refresh footer og:image card"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy workflow
        # The push above used GITHUB_TOKEN, so it cannot fire deploy.yml's
        # `push` trigger. Dispatch it instead; workflow_dispatch also ignores
        # deploy.yml's paths: filter, so the rebuild never silently skips.
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DEPLOY_REF: ${{ github.ref_name }}
        run: |
          case "$DEPLOY_REF" in
            master | main) ;;
            *)
              echo "::warning::Commit landed on $DEPLOY_REF, not a publish branch; not dispatching."
              exit 0
              ;;
          esac
          for i in 1 2 3; do
            if gh api --method POST --silent \
              "repos/$GH_REPO/actions/workflows/deploy.yml/dispatches" \
              -f ref="$DEPLOY_REF"; then
              echo "Dispatched deploy.yml on $DEPLOY_REF."
              exit 0
            fi
            echo "::warning::Dispatch attempt $i failed; retrying in 15s."
            sleep 15
          done
          echo "::error::Could not dispatch deploy.yml; the live site will stay stale."
          exit 1
